name: Build PySN Mobile unsigned IPA
on:
  push:
    branches: [pysn-ios]
    paths: ['PySN-Mobile/**', '.github/workflows/pysn-ios.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PySN-Mobile
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project PySNMobile.xcodeproj -scheme PySNMobile -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PySNMobile.app Payload/
          zip -qr PySN-Mobile.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PySN-Mobile-unsigned
          path: PySN-Mobile/PySN-Mobile.ipa
