name: Build RetroVerse PS5 Store ELF
on:
  workflow_dispatch:
  push:
    branches: [retroverse-ps5-alpha]
    paths:
      - 'retroverse/ps5/full/**'
      - '.github/workflows/build-retroverse-ps5-store.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 make python3 unzip wget
      - name: Install PS5 Payload SDK
        run: |
          wget -q -O /tmp/ps5-payload-sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk
      - name: Syntax check storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('retroverse/ps5/full/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, "Missing UI script"
          Path('/tmp/retroverse-store-ui.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/retroverse-store-ui.js
      - name: Collect curated Archive indexes at build time
        run: python3 retroverse/ps5/full/archive_catalog_build.py
      - name: Check Archive download endpoint from CI
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          url = "https://archive.org/download/ultimate-rom-collection/ultimate-rom-collection_meta.xml"
          req = Request(url, headers={"User-Agent": "RetroVerse-PS5-source-test/0.4"})
          with urlopen(req, timeout=45) as stream:
              payload = stream.read(2*1024*1024+1)
              status = stream.status
          assert status == 200, f"HTTP {status}"
          assert 128 <= len(payload) <= 2*1024*1024, f"Unexpected payload size: {len(payload)}"
          assert payload.lstrip().startswith(b"<") and b"metadata" in payload[:4096], "Invalid XML"
          print(f"PASS Archive HTTPS retrieval and contents: {len(payload):,} bytes")
          PY
      - name: Install pinned PacBrew libcurl and TLS libraries
        run: |
          curl -fL --retry 3 -o /tmp/pacbrew.tar.gz \
            https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz
          echo "a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d  /tmp/pacbrew.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/pacbrew.tar.gz -C / opt/ps5-payload-sdk/target/user
          /opt/ps5-payload-sdk/bin/prospero-pkg-config --cflags libcurl
          /opt/ps5-payload-sdk/bin/prospero-pkg-config --static --libs libcurl
      - name: Build store ELF
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make -C retroverse/ps5/full
          file retroverse/ps5/full/retroverse-ps5-store.elf
      - name: Upload PS5 ELF
        uses: actions/upload-artifact@v4
        with:
          name: RetroVerse-PS5-Store-ELF
          path: retroverse/ps5/full/retroverse-ps5-store.elf
          if-no-files-found: error
