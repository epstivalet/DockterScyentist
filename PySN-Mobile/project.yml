name: PySNMobile
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  PySNMobile:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [LICENSE]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pysn.mobile
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PySN Mobile
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
